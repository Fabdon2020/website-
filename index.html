<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreePDF – Free Online PDF Tools</title>
<meta name="description" content="100% free PDF tools: merge, split, compress, rotate, convert and more. Files never leave your browser.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a href="#" class="logo" id="home">Free<span>PDF</span></a>
  <span class="tag">100% free · no sign-up · files never leave your device</span>
</header>

<main>
  <section id="grid-view">
    <h1>Every PDF tool you need, completely free</h1>
    <p class="sub">All processing happens in your browser. No uploads, no limits, no watermarks.</p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="tool-view" hidden>
    <button class="back" id="back">← All tools</button>
    <h2 id="tool-title"></h2>
    <p id="tool-desc" class="sub"></p>
    <label class="drop" id="drop">
      <input type="file" id="file-input" hidden>
      <strong>Select files</strong> or drop them here
    </label>
    <ul class="files" id="file-list"></ul>
    <div class="options" id="options"></div>
    <button class="go" id="go" disabled>Process</button>
    <p class="status" id="status"></p>
  </section>
</main>

<footer>FreePDF — open source, free forever. Your files are processed locally and never uploaded.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
